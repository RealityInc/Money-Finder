name: Refresh MilliAPI x402scan discovery
on:
  push:
    branches:
      - ops/verify-post-402-20260901
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Discover and register MilliAPI origin
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://www.x402scan.com/api/trpc';
          async function call(procedure,input){
            const r=await fetch(`${base}/${procedure}?batch=1`,{method:'POST',headers:{'content-type':'application/json','x-trpc-source':'nextjs-react','user-agent':'MilliAPI-DiscoveryRefresh/1.0'},body:JSON.stringify({0:{json:input}})});
            const text=await r.text();
            console.log(procedure,'HTTP',r.status,text);
            if(!r.ok) process.exit(1);
          }
          await call('public.resources.checkDiscovery',{origin:'https://milliapi.com',bustCache:true});
          await call('public.resources.registerFromOrigin',{origin:'https://milliapi.com'});
          NODE
