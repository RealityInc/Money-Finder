name: Generate dependency lock (temporary)

on:
  push:
    branches:
      - fix/runtime-reproducibility-20260902

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-reproducibility-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate package-lock without install scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible dependency lockfile"
            git push origin HEAD:fix/runtime-reproducibility-20260902
          fi
