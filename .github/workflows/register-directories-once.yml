name: One-time x402 directory registrations

on:
  push:
    branches:
      - ops/register-directories-20260901

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Submit MilliAPI to Market402 and x402 List
        shell: bash
        run: |
          set -u

          endpoints=(
            'https://milliapi.com/api/ai-robots-check?url=https%3A%2F%2Fexample.com'
            'https://milliapi.com/api/llms-txt-check?url=https%3A%2F%2Fexample.com'
            'https://milliapi.com/api/page-metadata?url=https%3A%2F%2Fexample.com'
            'https://milliapi.com/api/agent-web-audit?url=https%3A%2F%2Fexample.com'
          )

          echo '=== Market402 self-tests and submissions ==='
          for endpoint in "${endpoints[@]}"; do
            echo "SELFTEST $endpoint"
            curl -sS --max-time 45 -w '\nHTTP_STATUS:%{http_code}\n' \
              -X POST 'https://market402.com/selftest' \
              -H 'content-type: application/json' \
              --data-binary "$(printf '{\"url\":\"%s\"}' "$endpoint")" || true

            echo "SUBMIT $endpoint"
            curl -sS --max-time 45 -w '\nHTTP_STATUS:%{http_code}\n' \
              -X POST 'https://market402.com/submit' \
              -H 'content-type: application/json' \
              --data-binary "$(printf '{\"url\":\"%s\"}' "$endpoint")" || true
          done

          echo '=== x402 List submission ==='
          cat > /tmp/x402-list.json <<'JSON'
          {
            "url": "https://milliapi.com",
            "email": "michael.molitchhou@gmail.com",
            "service_name": "MilliAPI",
            "description": "Micropaid deterministic web utilities for AI agents via x402 on Base: AI crawler policy checks, llms.txt discovery, page metadata extraction, and AI web-readiness audits.",
            "website_url": "https://milliapi.com",
            "category": "Data",
            "endpoints": [
              "/api/ai-robots-check",
              "/api/llms-txt-check",
              "/api/page-metadata",
              "/api/agent-web-audit"
            ],
            "notes": "OpenAPI: https://milliapi.com/openapi.json. x402 v2, USDC on Base. Bazaar and x402scan discovery metadata are enabled."
          }
          JSON

          curl -sS --max-time 60 -w '\nHTTP_STATUS:%{http_code}\n' \
            -X POST 'https://x402-list.com/api/v1/submit' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/x402-list.json || true

          echo '=== x402.direct free directory check ==='
          for page in $(seq 1 30); do
            body=$(curl -sS --max-time 30 "https://x402.direct/api/services?page=$page&limit=100" || true)
            if echo "$body" | grep -qi 'milliapi'; then
              echo "FOUND_ON_X402_DIRECT page=$page"
              echo "$body" | grep -io '.\{0,180\}milliapi.\{0,300\}' | head -5
              exit 0
            fi
            count=$(printf '%s' "$body" | python3 -c 'import json,sys;\ntry:\n d=json.load(sys.stdin); print(len(d.get("services", d.get("data", []))))\nexcept Exception: print(-1)' 2>/dev/null || echo -1)
            if [ "$count" = "0" ]; then break; fi
          done
          echo 'NOT_FOUND_ON_X402_DIRECT'
