name: Apply fast x402 challenge middleware

on:
  push:
    branches:
      - fix/fast-402-challenges

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fast-402-challenges
      - name: Patch paid routes
        shell: python
        run: |
          from pathlib import Path

          routes = {
              'api/ai-robots-check.js': {
                  'discovery': 'discovery',
                  'amount': 1000,
                  'description': 'Check robots.txt homepage permissions for major AI crawlers including GPTBot, OAI-SearchBot, ClaudeBot, Google-Extended, PerplexityBot and Applebot-Extended.',
                  'tags': "['robots','ai-crawlers','ai-search','crawler-policy','web']",
              },
              'api/llms-txt-check.js': {
                  'discovery': 'discovery',
                  'amount': 1000,
                  'description': 'Check whether a website publishes llms.txt and return its status, byte size, and a bounded preview for agent discovery workflows.',
                  'tags': "['llms-txt','ai-discovery','ai-search','web','metadata']",
              },
              'api/page-metadata.js': {
                  'discovery': 'discovery',
                  'amount': 2000,
                  'description': 'Extract title, description, canonical URL, robots meta, Open Graph, H1 count and JSON-LD count from a public HTTPS page.',
                  'tags': "['metadata','open-graph','json-ld','seo','web']",
              },
              'api/agent-web-audit.js': {
                  'discovery': 'discoveryExtension',
                  'amount': 5000,
                  'description': 'Check whether a public HTTPS page is ready for AI agents and answer engines. Returns AI-crawler access, robots.txt and llms.txt status, canonical and meta tags, Open Graph, JSON-LD, H1 count, and a 0-100 readiness score. Useful before crawling, indexing, or AI-search optimization.',
                  'tags': "['ai-agents', 'web-audit', 'ai-search', 'robots', 'llms-txt']",
              },
          }

          for path_str, cfg in routes.items():
              path = Path(path_str)
              text = path.read_text()
              import_line = "import { fastUnpaidChallenge } from './lib/fast-x402-challenge.js';\n"
              if import_line not in text:
                  marker = "import { registerLearningHooks } from './lib/learning-graph.js';\n"
                  if marker not in text:
                      raise SystemExit(f'missing import marker in {path}')
                  text = text.replace(marker, marker + import_line, 1)

              if 'fastUnpaidChallenge({' not in text:
                  if path_str == 'api/agent-web-audit.js':
                      marker = "if (PAYMENT_CONFIGURED) {\n"
                  elif path_str == 'api/ai-robots-check.js':
                      marker = "if (PAY_TO && process.env.CDP_API_KEY_ID && process.env.CDP_API_KEY_SECRET) {\n"
                  else:
                      marker = "if(PAY_TO&&process.env.CDP_API_KEY_ID&&process.env.CDP_API_KEY_SECRET){\n"
                  if marker not in text:
                      raise SystemExit(f'missing configured marker in {path}')
                  block = (
                      marker
                      + "  app.use(ROUTE, fastUnpaidChallenge({\n"
                      + "    route: ROUTE,\n"
                      + f"    amount: {cfg['amount']},\n"
                      + "    payTo: PAY_TO,\n"
                      + f"    description: {cfg['description']!r},\n"
                      + "    serviceName: 'MilliAPI',\n"
                      + f"    tags: {cfg['tags']},\n"
                      + "    iconUrl: `${PUBLIC_ORIGIN}/icon.svg`,\n"
                      + f"    extensions: {{ ...{cfg['discovery']} }}\n"
                      + "  }));\n"
                  )
                  text = text.replace(marker, block, 1)

              path.write_text(text)

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/
          git commit -m 'Make unpaid x402 challenges cold-start safe'
          git push origin HEAD:fix/fast-402-challenges
