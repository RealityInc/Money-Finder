name: Verify unsigned POST x402 challenges
on:
  push:
    branches:
      - ops/verify-post-402-20260901
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe batch and change endpoints without payment
        shell: bash
        run: |
          set -euo pipefail
          check() {
            name="$1"
            url="$2"
            data="$3"
            expected="$4"
            body="$(mktemp)"
            headers="$(mktemp)"
            status=$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' --data "$data")
            echo "$name HTTP=$status"
            grep -i '^payment-required:' "$headers" >/dev/null
            test "$status" = '402'
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(d.x402Version!==2) throw Error('bad x402 version'); if(d.accepts?.[0]?.amount!==process.argv[2]) throw Error('bad amount '+d.accepts?.[0]?.amount); console.log(JSON.stringify({resource:d.resource?.url,amount:d.accepts[0].amount,network:d.accepts[0].network}))" "$body" "$expected"
          }
          check batch 'https://milliapi.com/api/agent-web-audit-batch' '{"urls":["https://example.com"]}' '20000'
          check change 'https://milliapi.com/api/site-readiness-change' '{"url":"https://example.com","baselineToken":"dummy"}' '3000'
